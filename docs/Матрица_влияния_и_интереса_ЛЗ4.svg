<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900"><style>text{font-family:Arial,sans-serif;fill:#17354b}.title{font-size:38px;font-weight:700}.sub{font-size:18px;fill:#526779}.axis{font-size:20px;font-weight:700}.head{font-size:21px;font-weight:700}.body{font-size:18px}.grid{stroke:#7894a5;stroke-width:2}</style><rect width="1400" height="900" fill="#f7fbfe"/><text x="700" y="54" text-anchor="middle" class="title">Матрица стейкхолдеров: влияние × интерес</text><text x="700" y="87" text-anchor="middle" class="sub">Оценка качественная; позиции подтвердить командой и заказчиком</text><text x="755" y="140" text-anchor="middle" class="axis">ИНТЕРЕС →</text><text x="480" y="177" text-anchor="middle" class="head">НИЗКИЙ / СРЕДНИЙ</text><text x="1030" y="177" text-anchor="middle" class="head">ВЫСОКИЙ</text><text transform="translate(75 490) rotate(-90)" text-anchor="middle" class="axis">ВЛИЯНИЕ ↑</text><text x="158" y="330" text-anchor="middle" class="head">ВЫСОКОЕ</text><text x="158" y="670" text-anchor="middle" class="head">СРЕДНЕЕ / НИЗКОЕ</text><rect x="220" y="200" width="535" height="290" fill="#e8f2f8" class="grid"/><rect x="755" y="200" width="535" height="290" fill="#dff0e3" class="grid"/><rect x="220" y="490" width="535" height="290" fill="#f1f5f7" class="grid"/><rect x="755" y="490" width="535" height="290" fill="#e5f3fb" class="grid"/><text x="250" y="245" class="head">ДЕРЖАТЬ УДОВЛЕТВОРЁННЫМИ</text><text x="250" y="292" class="body"><tspan x="250">• Администратор системы</tspan><tspan x="250" dy="34">• Ответственный за ИБ</tspan><tspan x="250" dy="34">• Преподаватель — учебная приёмка</tspan></text><text x="785" y="245" class="head">УПРАВЛЯТЬ ПЛОТНО</text><text x="785" y="292" class="body"><tspan x="785">• Маканова Г.Т. — бизнес-заказчик</tspan></text><text x="250" y="535" class="head">НАБЛЮДАТЬ</text><text x="250" y="580" class="body"><tspan x="250">• Клиенты — внешние лица / субъекты ПДн</tspan><tspan x="250" dy="32">• Не входят и не работают в системе</tspan></text><text x="785" y="535" class="head">ВОВЛЕКАТЬ / ИНФОРМИРОВАТЬ</text><text x="785" y="580" class="body"><tspan x="785">• Менеджеры Oneway_kz — пользователи системы</tspan></text><text x="220" y="830" class="sub">Основная команда — исполнители; её взаимодействие описано в плане коммуникаций, а не в матрице стейкхолдеров.</text></svg>