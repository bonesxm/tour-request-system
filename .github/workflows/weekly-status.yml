name: weekly-status

on:
  workflow_dispatch:
  schedule:
    - cron: '0 10 * * 5'

permissions:
  contents: read
  issues: read
  pull-requests: read
  deployments: read

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - name: Generate weekly status report
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          python3 - <<'PY'
          import datetime as dt
          import json
          import os
          import pathlib
          import urllib.request
          import urllib.error
          import re

          repo = os.environ['REPO']
          token = os.environ['GH_TOKEN']
          now = dt.datetime.now(dt.timezone.utc)
          start = now - dt.timedelta(days=7)

          def request_all(endpoint):
              url = f'https://api.github.com/repos/{repo}/{endpoint}'
              items = []
              while url:
                  req = urllib.request.Request(url, headers={
                      'Authorization': f'Bearer {token}',
                      'Accept': 'application/vnd.github+json',
                      'User-Agent': 'TourFlow-weekly-status',
                      'X-GitHub-Api-Version': '2022-11-28',
                  })
                  with urllib.request.urlopen(req, timeout=40) as response:
                      chunk = json.load(response)
                      if not isinstance(chunk, list):
                          raise ValueError(f'Expected list from {url}')
                      items.extend(chunk)
                      link = response.headers.get('Link', '')
                      url = None
                      for part in link.split(','):
                          if 'rel="next"' in part:
                              match = re.search(r'<([^>]+)>', part)
                              if match:
                                  url = match.group(1)
                  if len(items) > 5000:
                      raise RuntimeError('More than 5000 records; narrow API request')
              return items

          def date(value):
              return dt.datetime.fromisoformat(value.replace('Z', '+00:00'))

          def in_period(value):
              return bool(value) and start <= date(value) < now

          issues = [i for i in request_all('issues?state=all&per_page=100') if 'pull_request' not in i]
          prs = request_all('pulls?state=all&per_page=100')
          deployments = request_all('deployments?per_page=100')
          opened_now = [i for i in issues if i['state'] == 'open']
          created = [i for i in issues if in_period(i.get('created_at'))]
          closed = [i for i in issues if in_period(i.get('closed_at'))]
          merged = [p for p in prs if in_period(p.get('merged_at'))]
          deployed = [d for d in deployments if in_period(d.get('created_at'))]
          blocked = [i for i in opened_now if any('block' in label['name'].lower() for label in i.get('labels', []))]
          progress = [i for i in opened_now if any(label['name'].lower() in ('in progress', 'in-progress', 'doing', 'в работе') for label in i.get('labels', []))]

          facts = {
              'repository': repo,
              'period_start_utc': start.isoformat(),
              'period_end_exclusive_utc': now.isoformat(),
              'counts': {
                  'issues_created_in_period': len(created),
                  'issues_closed_in_period': len(closed),
                  'open_issues_at_collection': len(opened_now),
                  'blocked_open_by_label': len(blocked),
                  'in_progress_open_by_label': len(progress),
                  'prs_merged_in_period': len(merged),
                  'deployment_records_created_in_period': len(deployed),
              },
              'evidence': {
                  'created_issues': [x['html_url'] for x in created],
                  'closed_issues': [x['html_url'] for x in closed],
                  'merged_prs': [x['html_url'] for x in merged],
