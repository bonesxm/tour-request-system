
name: weekly-status

on:
  workflow_dispatch:
  schedule:
    - cron: '0 10 * * 5'

permissions:
  contents: read
  issues: read
  pull-requests: read

jobs:
  report:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Generate GitHub status report
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python scripts/weekly_status.py \
            --start "$(date -u -d '7 days ago' +%Y-%m-%dT%H:%M:%SZ)" \
            --end "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --output outputs/weekly

      - name: Upload report
        uses: actions/upload-artifact@v4
        with:
          name: weekly-status-report
          path: outputs/weekly/

