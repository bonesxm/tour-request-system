name: weekly-status

on:
  workflow_dispatch:
  schedule:
    - cron: '0 10 * * 5'

permissions:
  contents: read
  issues: read
  pull-requests: read
  deployments: read

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - name: Generate weekly status report
        uses: actions/github-script@v9
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const { owner, repo } = context.repo;
            const fullRepo = `${owner}/${repo}`;
            const end = new Date();
            const start = new Date(end.getTime() - 7 * 24 * 60 * 60 * 1000);
            const inPeriod = (value) => value && new Date(value) >= start && new Date(value) < end;

            const allIssues = await github.paginate(github.rest.issues.listForRepo, {
              owner, repo, state: 'all', per_page: 100
            });
            const issues = allIssues.filter(item => !item.pull_request);
            const prs = await github.paginate(github.rest.pulls.list, {
              owner, repo, state: 'all', per_page: 100
            });
            const deployments = await github.paginate(github.rest.repos.listDeployments, {
              owner, repo, per_page: 100
            });

            const created = issues.filter(item => inPeriod(item.created_at));
            const closed = issues.filter(item => inPeriod(item.closed_at));
            const merged = prs.filter(item => inPeriod(item.merged_at));
            const openNow = issues.filter(item => item.state === 'open');
            const blocked = openNow.filter(item => (item.labels || []).some(label =>
              /block|заблок/i.test(typeof label === 'string' ? label : label.name || '')));
            const inProgress = openNow.filter(item => (item.labels || []).some(label =>
              /^(in progress|in-progress|doing|в работе)$/i.test(typeof label === 'string' ? label : label.name || '')));
            const periodDeployments = deployments.filter(item => inPeriod(item.created_at));
            const ref = item => ({
              number: item.number, title: item.title, url: item.html_url,
              created_at: item.created_at, closed_at: item.closed_at || null,
              merged_at: item.merged_at || null
            });

            const facts = {
              repository: fullRepo,
              period_start_utc: start.toISOString(),
              period_end_exclusive_utc: end.toISOString(),
              data_source: 'GitHub API',
              counts: {
                issues_created_in_period: created.length,
                issues_closed_in_period: closed.length,
                open_issues_at_collection: openNow.length,
                blocked_open_by_label: blocked.length,
                in_progress_open_by_label: inProgress.length,
                prs_merged_in_period: merged.length,
                deployment_records_created_in_period: periodDeployments.length
              },
              evidence: {
                created_issues: created.map(ref),
                closed_issues: closed.map(ref),
                merged_prs: merged.map(ref),
                blocked_open_issues: blocked.map(ref),
                in_progress_open_issues: inProgress.map(ref),
                deployment_records: periodDeployments.map(item => ({
                  id: item.id, created_at: item.created_at, sha: item.sha, url: item.url
                }))
              },
              limitations: [
                'Открытые Issues — текущий снимок, а не состояние на конец спринта.',
                'Blocked и in progress определяются только по меткам Issues.',
                'Записи GitHub Deployments API не равны успешным релизам Render.',
                'История повторных закрытий и открытий Issues не восстанавливается.'
              ]
            };

            fs.mkdirSync('outputs/weekly', { recursive: true });
            fs.writeFileSync('outputs/weekly/facts.json', JSON.stringify(facts, null, 2));
            const c = facts.counts;
            const report = [
              `# Еженедельный статус-отчёт: ${fullRepo}`,
              `Период UTC: ${start.toISOString()} — ${end.toISOString()} (конец не включён)`,
              '',
              '## Показатели GitHub',
              `- Создано Issues: ${c.issues_created_in_period}`,
              `- Закрыто Issues: ${c.issues_closed_in_period}`,
              `- Объединено PR: ${c.prs_merged_in_period}`,
              `- Открытых Issues сейчас: ${c.open_issues_at_collection}`,
              `- Из них с меткой blocked: ${c.blocked_open_by_label}`,
              `- Из них с меткой in progress: ${c.in_progress_open_by_label}`,
              `- Записей GitHub Deployments API: ${c.deployment_records_created_in_period}`,
              '',
              '## Ограничения',
              ...facts.limitations.map(value => `- ${value}`),
              '',
              'Источник: GitHub API. Числа вычислены автоматически; комментарий ИИ не генерировался.'
            ].join('\n') + '\n';
            fs.writeFileSync('outputs/weekly/report_deterministic.md', report);
            console.log(report);

      - name: Upload weekly report
        uses: actions/upload-artifact@v7
        with:
          name: weekly-status-report
          path: outputs/weekly/
          if-no-files-found: error
